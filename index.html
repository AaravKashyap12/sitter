<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sitter</title>
  <meta name="description" content="A portrait painting studio built for computer-use agents.">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- The studio is one fixed 1160x1200 (29:30) frame: the exact shot that gets recorded. -->
  <div id="stage" class="stage">
    <header class="bar">
      <div class="group" role="group" aria-label="Brush size">
        <span class="glabel">Brush</span>
        <div class="sizes" id="sizes"></div>
      </div>

      <div class="group" role="group" aria-label="Colour">
        <span class="glabel">Colour</span>
        <span class="swatch" id="swatch" aria-hidden="true"></span>
        <label class="hex" id="hexbox">
          <span class="hash">#</span>
          <input id="hex" type="text" inputmode="text" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Hex colour, press Enter to apply">
          <span class="enter">Enter ↵</span>
        </label>
      </div>

      <div class="actions">
        <button class="btn" id="undo" type="button" aria-label="Undo last stroke">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5 3 9l4 4M3.5 9H12a5 5 0 0 1 0 10H9" /></svg>Undo
        </button>
        <button class="btn primary" id="save" type="button" aria-label="Save PNG">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10M6 9l4 4 4-4M4 16h12" /></svg>Save PNG
        </button>
      </div>
    </header>

    <div class="frame" id="frame">
      <canvas id="paint" aria-label="Painting canvas"></canvas>
      <canvas id="grain" aria-hidden="true"></canvas>
    </div>

    <aside class="panel">
      <section>
        <div class="plabel">Reference</div>
        <figure class="ref">
          <img id="refimg" alt="" hidden>
          <p class="ref-empty" id="refEmpty" hidden>No reference yet. Add an image and <code>reference/reference.json</code>, then reload.</p>
          <figcaption id="refCredit"></figcaption>
        </figure>
      </section>

      <section>
        <div class="plabel">Painting pass</div>
        <div class="pass-now"><span class="numeral" id="passNum">I</span><span class="pass-name" id="passName">Block-in</span></div>
        <div class="passes" id="passes" role="group" aria-label="Painting pass"></div>
      </section>

      <section>
        <dl class="stats">
          <div><dt>Strokes</dt><dd id="statStrokes">0</dd></div>
          <div><dt>Brush</dt><dd><span class="chip" id="statChip"></span><span id="statBrush">40</span></dd></div>
          <div><dt>Time</dt><dd id="statTime">0:00</dd></div>
        </dl>

        <footer class="foot">
          <span class="brand">
            <svg class="mark" viewBox="0 0 28 28" aria-hidden="true"><path d="M5 20c3-9 9-14 18-15-3 4-5 9-11 13-2 1-4 2-7 2z" /><circle cx="7" cy="22" r="2.2" /></svg>
            <span class="name">Sitter</span>
          </span>
          <span class="save-state"><span class="dot" id="saveDot"></span><span id="saveText">Autosaving</span></span>
        </footer>
      </section>
    </aside>

    <div class="ring" id="ring" aria-hidden="true"></div>
    <svg class="cursor" id="cursor" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 2.5v17.2l4.6-4.4 3.1 6.9 3-1.3-3.1-6.8h6.3z" /></svg>
    <div class="toast" id="toast" role="status"></div>
  </div>

  <div class="hud" id="hud" hidden>
    <button id="hudPlay" type="button" aria-label="Play or pause">Pause</button>
    <input id="hudScrub" type="range" min="0" max="1000" value="0" aria-label="Replay position">
    <span id="hudTime">0:00 / 0:00</span>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
